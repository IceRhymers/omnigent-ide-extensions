# Checks the VS Code extension on every PR and push to master that touches it:
# format, type-check, unit + conformance tests and the bundle build, then a
# full .vsix package (with the web app built from the omnigent submodule),
# uploaded as an artifact so a PR's build can be installed and tried.
name: VS Code Extension CI

on:
  pull_request:
    paths:
      - "vscode/**"
      - "docs/conformance/**"
      - "third_party/omnigent"
      - "Makefile"
      - ".github/workflows/vscode-ci.yml"
  push:
    branches: [master]
    paths:
      - "vscode/**"
      - "docs/conformance/**"
      - "third_party/omnigent"
      - "Makefile"
      - ".github/workflows/vscode-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: vscode/package.json
          cache: true
          cache_dependency_path: vscode/pnpm-lock.yaml

      - run: make install
      - run: make check

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 1

      - run: make vendor-check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: vscode/package.json
          cache: true
          cache_dependency_path: |
            vscode/pnpm-lock.yaml
            third_party/omnigent/pnpm-lock.yaml

      - run: make install
      - run: make web-deps
      - run: make package-vscode

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omnigent-vscode-vsix
          path: vscode/*.vsix
          if-no-files-found: error
          retention-days: 14
